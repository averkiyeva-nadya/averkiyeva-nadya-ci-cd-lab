name: Pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lint HTML
        id: lint
        continue-on-error: true
        run: npx --yes htmlhint@1.9.2 --rules doctype-first,tag-pair index.html

      - name: Smoke test container
        run: |
          docker build -t lab .
          docker run -d -p 8080:80 lab
          curl -fsS --retry 5 --retry-all-errors http://127.0.0.1:8080/ -o page.html
          grep -F 'GitHub: averkiyeva-nadya' page.html
          echo OK

      - name: Fail CI if lint failed
        if: ${{ steps.lint.outcome == 'failure' }}
        run: exit 1

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Build and push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY:latest"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" .
          docker push "$image"
